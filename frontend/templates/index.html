<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>SP Ponto Seguro</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../static/style.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>

  <!-- HEADER -->
  <header>
    <h1>SP Ponto Seguro</h1>
    <p>Crimes próximos a pontos de ônibus</p>
  </header>

  <!-- CONTEÚDO -->
  <main>

    <!-- CONTROLES -->
    <div class="controles">
  <label for="filtro">Ano:</label>
  <select id="filtro">
    <option value="2023">2023</option>
    <option value="2024">2024</option>
    <option value="2025">2025</option>
  </select>
</div>

    <!-- MAPA -->
    <div id="map"></div>

    <!-- INFO -->
    <div class="info">
      <h2>Sobre o projeto</h2>
      <p>
        Este mapa mostra crimes que ocorreram em um raio de 100 metros de pontos de ônibus,
        ajudando a identificar áreas de maior risco.
      </p>
    </div>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Seu JS -->
  <script src="../static/script.js"></script>

</body>
</html>
