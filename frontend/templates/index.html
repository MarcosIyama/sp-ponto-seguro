{% extends "base.html" %}

{% block head %}
<!-- Leaflet CSS (versão fixada) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
{% endblock %}

{% block content %}

<!-- CONTROLES -->
<div class="controles">
    <label for="filtro">Ano:</label>
    <select id="filtro">
        <option value="todos" selected>Todos</option>
        <option value="2023">2023</option>
        <option value="2024">2024</option>
        <option value="2025">2025</option>
        <option value="2026">2026</option>
    </select>
</div>

<!-- MAPA -->
<div id="map" role="region" aria-label="Mapa de crimes próximos a pontos de ônibus"></div>

<!-- INFO -->
<div class="info">
    <h2>Sobre o projeto</h2>
    <p>
        Este mapa mostra crimes que ocorreram em um raio de 50 metros de pontos de ônibus,
        ajudando a identificar áreas de maior risco.
    </p>
</div>

{% endblock %}

{% block scripts %}
<!-- Leaflet JS (versão fixada) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Seu JS -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
{% endblock %}
